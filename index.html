    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900;1000&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #030712;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }
        .view-section {
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
        }
        .hidden-view {
            display: none !important;
            opacity: 0;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 bg-slate-950">

    <!-- Header -->

            <span>مركز الراشد لشحن الخدمات والألعاب</span>
        </div>
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-sky-300 to-pink-400">
            مركز الراشد الإلكتروني
        </h1>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="w-full max-w-md mx-auto my-auto py-3">

        <!-- 1. HOME VIEW (GRID OF GAMES & SERVICES) -->
        <section id="homeView" class="view-section space-y-4">
            <div class="text-center space-y-1 mb-3">
                <p class="text-sm font-extrabold text-slate-300">اختر الخدمة أو اللعبة للاطلاع على الأسعار</p>
            </div>

            <div class="grid grid-cols-2 gap-3" id="servicesGrid">
                <!-- Injected via JavaScript -->
            </div>
        </section>

        <!-- 2. DETAIL VIEW (SELECTED SERVICE PRICES) -->
        <section id="detailView" class="view-section hidden-view space-y-4">
            <!-- Top Nav Back Button -->
            <button onclick="navigateHome()" class="w-full py-3 px-4 rounded-2xl bg-slate-900 border-2 border-slate-700 text-white font-black text-sm flex items-center justify-between shadow-lg active:scale-98 transition">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-arrow-right text-amber-400 text-lg"></i>
                    <span>الرجوع إلى القائمة الرئيسية</span>
                </div>
                <span class="text-xs text-slate-400">تغيير اللعبة</span>
            </button>

            <!-- Service Header Card -->
            <div id="detailHeader" class="p-4 rounded-3xl border-2 flex items-center justify-between shadow-xl">
                <!-- Injected via JS -->
            </div>

            <!-- Package Rows Container -->
            <div id="detailPackages" class="space-y-2.5">
                <!-- Injected via JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md mx-auto text-center py-3 text-xs text-slate-500 font-bold border-t border-slate-900 mt-2">
        أبلغ الموظف بالباقة المطلوبة للشحن مباشرة
    </footer>

                subtitle: 'Gems & Gold',

                badgeColor: 'text-emerald-300 bg-black/50 border-emerald-400/30',
                packages: [
                    { amount: '860 ألماس / 68,500 ذهب', price: '4,000 د.ع' },
                    { amount: '2,320 ألماس / 223,700 ذهب', price: '8,000 د.ع' },
                    { amount: '5,150 ألماس / 1,463,320 ذهب', price: '15,000 د.ع' },
                    { amount: '13,580 ألماس / 3,666,470 ذهب', price: '36,000 د.ع' },
                    { amount: '27,640 ألماس / 9,973,990 ذهب', price: '70,000 د.ع' },
                    { amount: '55,800 ألماس / 25,236,460 ذهب', price: '138,000 د.ع' }
                ]
            }
        ];

        // Render Home Grid Cards
        function renderHomeGrid() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = servicesData.map(service => `
                <button onclick="openDetail('${service.id}')" 
                        class="bg-gradient-to-b ${service.cardBg} border-2 ${service.border} p-4 rounded-3xl flex flex-col items-center text-center justify-between space-y-3 shadow-xl hover:scale-105 active:scale-95 transition cursor-pointer overflow-hidden">
                    <div class="w-16 h-16 rounded-2xl bg-black/50 border border-white/10 flex items-center justify-center text-3xl shadow-inner overflow-hidden p-0.5">
                        ${service.logo}
                    </div>
                    <div>
                        <h3 class="font-black text-white text-base leading-tight">${service.name}</h3>
                        <p class="text-[11px] text-slate-400 font-bold mt-0.5">${service.subtitle}</p>
                    </div>
                    <span class="w-full py-1.5 rounded-xl bg-white/10 border border-white/20 text-xs font-black text-amber-300">
                        عرض الأسعار
                    </span>
                </button>
            `).join('');
        }

        // Open Service Details View
        function openDetail(serviceId, pushHistory = true) {
            const service = servicesData.find(s => s.id === serviceId);
            if (!service) return;

            // Render Header
            const header = document.getElementById('detailHeader');
            header.className = `p-4 rounded-3xl border-2 bg-gradient-to-r ${service.headerBg} flex items-center justify-between shadow-xl`;
            header.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 rounded-2xl bg-black/40 flex items-center justify-center border border-white/20 overflow-hidden p-0.5">
                        ${service.logo}
                    </div>
                    <div class="text-right">
                        <h2 class="text-xl font-black leading-tight">${service.name}</h2>
                        <p class="text-xs opacity-90 font-bold">${service.subtitle}</p>
                    </div>
                </div>
                <span class="px-3 py-1 rounded-xl text-xs font-black border ${service.badgeColor}">تسليم فوري</span>
            `;

            // Render Package Rows
            const packagesContainer = document.getElementById('detailPackages');
            packagesContainer.innerHTML = service.packages.map(pkg => `
                <div class="flex items-center justify-between gap-2 p-3.5 rounded-2xl bg-slate-900 border border-slate-800 shadow-sm">
                    <div class="flex-1 min-w-0">
                        <span class="text-sm sm:text-base font-black text-white block truncate">
                            ${pkg.amount}
                        </span>
                        ${pkg.extra ? `<span class="text-xs font-bold text-emerald-400 block">${pkg.extra}</span>` : ''}
                    </div>
                    <span class="text-base sm:text-lg font-black ${service.priceColor} font-mono bg-slate-950 px-3 py-1 rounded-xl border border-slate-800 whitespace-nowrap shrink-0">
                        ${pkg.price}
                    </span>
                </div>
            `).join('');

            // Switch Views
            document.getElementById('homeView').classList.add('hidden-view');
            document.getElementById('detailView').classList.remove('hidden-view');

            if (pushHistory) {
                history.pushState({ view: 'detail', id: serviceId }, '', `#${serviceId}`);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Navigate Back to Home
        function navigateHome(pushHistory = true) {
            document.getElementById('detailView').classList.add('hidden-view');
            document.getElementById('homeView').classList.remove('hidden-view');

            if (pushHistory) {
                history.pushState({ view: 'home' }, '', window.location.pathname);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Handle Hardware/Browser Back Button
        window.onpopstate = function(event) {
            if (event.state && event.state.view === 'detail') {
                openDetail(event.state.id, false);
            } else {
                navigateHome(false);
            }
        };

        // Initialize App
        window.onload = function() {
            renderHomeGrid();
            
            // Check deep link hash
            const hash = window.location.hash.replace('#', '');
            if (hash && servicesData.some(s => s.id === hash)) {
                openDetail(hash, false);
            }
        };
    </script>
</body>
</html>
