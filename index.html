<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز الراشد للشحن الإلكتروني</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900;1000&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #030712;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            /* تم إزالة overflow-x: hidden من هنا حتى يشتغل الـ sticky */
        }

        /* --- Animations --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes slideInDetail {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideBackHome {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .animate-item {
            opacity: 0;
            animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-detail-enter {
            animation: slideInDetail 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-home-enter {
            animation: slideBackHome 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .skeleton-box {
            background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        .hidden-view {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950">

            </h1>

        <!-- زر الرجوع الثابت (يظهر فقط داخل تفاصيل اللعبة) -->

            <button onclick="navigateHome()" class="w-full py-2.5 px-4 rounded-xl bg-slate-900 border-2 border-slate-700 text-white font-black text-sm flex items-center justify-between shadow-lg active:scale-95 transition-transform duration-200">

                    <i class="fa-solid fa-arrow-right text-amber-400 text-lg"></i>
                    <span>الرجوع إلى القائمة الرئيسية</span>
                </div>
            </button>
        </div>
    </div>

    <!-- Main Content Wrapper (يمنع حركة الشاشة يمين ويسار) -->
    <div class="overflow-x-hidden w-full flex-1 flex flex-col">
        <main class="w-full max-w-md mx-auto flex-1 py-3 px-3 sm:px-6">

            <!-- 1. HOME VIEW -->
            <section id="homeView" class="space-y-4">

                </div>

                <!-- Skeleton Loader Grid -->
                <div id="skeletonGrid" class="grid grid-cols-2 gap-3">

                        <div class="w-20 h-4 rounded-lg bg-slate-800/50"></div>
                        <div class="w-full h-8 rounded-xl bg-slate-800/50"></div>
                    </div>
                    <div class="skeleton-box h-40 rounded-3xl border border-slate-800/80 p-4 flex flex-col items-center justify-between shadow-xl">
                        <div class="w-16 h-16 rounded-2xl bg-slate-800/50"></div>
                        <div class="w-20 h-4 rounded-lg bg-slate-800/50"></div>
                        <div class="w-full h-8 rounded-xl bg-slate-800/50"></div>
                    </div>
                    <div class="skeleton-box h-40 rounded-3xl border border-slate-800/80 p-4 flex flex-col items-center justify-between shadow-xl">

                        <div class="w-16 h-16 rounded-2xl bg-slate-800/50"></div>
                        <div class="w-20 h-4 rounded-lg bg-slate-800/50"></div>
                        <div class="w-full h-8 rounded-xl bg-slate-800/50"></div>
                    </div>
                </div>

                <!-- Actual Services Grid -->
                <div class="grid grid-cols-2 gap-3 hidden-view" id="servicesGrid">
                    <!-- Injected via JavaScript -->
                </div>
            </section>

            <!-- 2. DETAIL VIEW -->
            <section id="detailView" class="hidden-view space-y-4 pt-1">
                <!-- Service Header Card -->
                <div id="detailHeader" class="p-4 rounded-3xl border-2 flex items-center justify-between shadow-xl">
                    <!-- Injected via JS -->
                </div>

                <!-- Package Rows Container -->
                <div id="detailPackages" class="space-y-2.5 pb-6">
                    <!-- Injected via JS -->
                </div>
            </section>

        </main>
    </div>

        function renderHomeGrid() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = servicesData.map((service, index) => `
                <button onclick="openDetail('${service.id}')" 
                        style="animation-delay: ${index * 60}ms;"
                        class="animate-item bg-gradient-to-b ${service.cardBg} border-2 ${service.border} p-4 rounded-3xl flex flex-col items-center text-center justify-between space-y-3 shadow-xl active:scale-95 transition-transform duration-200 cursor-pointer overflow-hidden">
                    <div class="w-16 h-16 rounded-2xl bg-black/50 border border-white/10 flex items-center justify-center text-3xl shadow-inner overflow-hidden p-0.5">
                        ${service.logo}
                    </div>
                    <div>
                        <h3 class="font-black text-white text-base leading-tight">${service.name}</h3>
                        <p class="text-[11px] text-slate-400 font-bold mt-0.5">${service.subtitle}</p>
                    </div>
                    <span class="w-full py-1.5 rounded-xl bg-white/10 border border-white/20 text-xs font-black text-amber-300">
                        عرض الأسعار
                    </span>
                </button>
            `).join('');
        }

        function openDetail(serviceId, pushHistory = true) {
            const service = servicesData.find(s => s.id === serviceId);
            if (!service) return;

            // إظهار زر الرجوع الثابت
            document.getElementById('stickyBackButtonContainer').classList.remove('hidden-view');

            const header = document.getElementById('detailHeader');
            header.className = `p-4 rounded-3xl border-2 bg-gradient-to-r ${service.headerBg} flex items-center justify-between shadow-xl`;
            header.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 rounded-2xl bg-black/40 flex items-center justify-center border border-white/20 overflow-hidden p-0.5">
                        ${service.logo}
                    </div>
                    <div class="text-right">
                        <h2 class="text-xl font-black leading-tight">${service.name}</h2>
                        <p class="text-xs opacity-90 font-bold">${service.subtitle}</p>
                    </div>
                </div>
                <span class="px-3 py-1 rounded-xl text-xs font-black border ${service.badgeColor}">تسليم فوري</span>
            `;

            const packagesContainer = document.getElementById('detailPackages');
            packagesContainer.innerHTML = service.packages.map((pkg, idx) => `
                <div style="animation-delay: ${idx * 45}ms;" 
                     class="animate-item flex items-center justify-between gap-2 p-3.5 rounded-2xl bg-slate-900 border border-slate-800 shadow-sm">
                    <div class="flex-1 min-w-0">
                        <span class="text-sm sm:text-base font-black text-white block truncate">
                            ${pkg.amount}
                        </span>
                        ${pkg.extra ? `<span class="text-xs font-bold text-emerald-400 block">${pkg.extra}</span>` : ''}
                    </div>
                    <span class="text-base sm:text-lg font-black ${service.priceColor} font-mono bg-slate-950 px-3 py-1 rounded-xl border border-slate-800 whitespace-nowrap shrink-0">
                        ${pkg.price}
                    </span>
                </div>
            `).join('');

            const homeView = document.getElementById('homeView');
            const detailView = document.getElementById('detailView');
            
            homeView.classList.add('hidden-view');
            homeView.classList.remove('animate-home-enter');
            
            detailView.classList.remove('hidden-view');
            detailView.classList.remove('animate-detail-enter');
            void detailView.offsetWidth; 
            detailView.classList.add('animate-detail-enter');

            if (pushHistory) {
                history.pushState({ view: 'detail', id: serviceId }, '', `#${serviceId}`);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigateHome(pushHistory = true) {
            const homeView = document.getElementById('homeView');
            const detailView = document.getElementById('detailView');

            // إخفاء زر الرجوع الثابت
            document.getElementById('stickyBackButtonContainer').classList.add('hidden-view');

            detailView.classList.add('hidden-view');
            detailView.classList.remove('animate-detail-enter');

            homeView.classList.remove('hidden-view');
            homeView.classList.remove('animate-home-enter');
            void homeView.offsetWidth; 
            homeView.classList.add('animate-home-enter');

            renderHomeGrid();

            if (pushHistory) {
                history.pushState({ view: 'home' }, '', window.location.pathname);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onpopstate = function(event) {
            if (event.state && event.state.view === 'detail') {
                openDetail(event.state.id, false);
            } else {
                navigateHome(false);
            }
        };

        window.onload = function() {
            const hash = window.location.hash.replace('#', '');
            
            // تسجيل الصفحة الرئيسية كأول صفحة بالـ History (حل مشكلة زر الرجوع بالجهاز للروابط المباشرة)
            history.replaceState({ view: 'home' }, '', window.location.pathname);

            if (hash && servicesData.some(s => s.id === hash)) {
                // تسجيل صفحة اللعبة كصفحة ثانية بعد الرئيسية
                history.pushState({ view: 'detail', id: hash }, '', '#' + hash);

                document.getElementById('skeletonGrid').classList.add('hidden-view');
                document.getElementById('servicesGrid').classList.remove('hidden-view');
                renderHomeGrid();
                openDetail(hash, false);
                return;
            }

            setTimeout(() => {
                document.getElementById('skeletonGrid').classList.add('hidden-view');
                const servicesGrid = document.getElementById('servicesGrid');
                servicesGrid.classList.remove('hidden-view');
                renderHomeGrid();
            }, 600);
        };
    </script>
</body>
</html>
